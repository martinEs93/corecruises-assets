name: Core Cruises alert egress

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: read

concurrency:
  group: core-cruises-alert-egress
  cancel-in-progress: false

jobs:
  fetch-public-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fixed-host offers and return signed results
        env:
          CC_ALERT_EGRESS_KEY: ${{ secrets.CC_ALERT_EGRESS_KEY }}
        run: python3 scripts/cruisecompass_alert_egress.py
